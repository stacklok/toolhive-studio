nodeLinker: hoisted
engineStrict: true

# Disable pnpm 11's pre-script `verify-deps-before-run` install pass. Without
# this, the `npm version` step in `on-release.yml` / `pr-build-test.yml`
# (which mutates `package.json`) makes the next `pnpm run publish` /
# `pnpm run make` trigger a second install pass that re-resolves overrides.
# On the `ubuntu-24.04-arm` runner that second pass can hang at end-of-install ~90% of the time in
# interruptible sleep at ~600MB RSS, blocking the job for 30+ min and
# producing silent cancels (see v0.35.0-rc.0 through v0.35.3-rc.1).
# v0.34.x ran on pnpm 10.33.0 which didn't have this setting and shipped
# arm releases first-try every time — disabling it on pnpm 11.x replicates
# that behavior without touching the lockfile or override resolution.
verifyDepsBeforeRun: false

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  # v13 ships N-API prebuilds; allowBuilds must list the package so pnpm 11
  # install does not fail with ERR_PNPM_IGNORED_BUILDS (prebuilds are preferred
  # over any local build/Release output at runtime).
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  msw: true
  sharp: true

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5

overrides:
  # Only overrides where parent ranges cannot reach a patched version.
  # Electron Forge still declares @electron/rebuild ^3.7.0.
  '@electron/rebuild': ^4.2.0
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0 exactly.
  js-yaml: '>=5.4.1'
  # external-editor declares tmp ^0.0.33, which cannot reach 0.2.7.
  tmp: '>=0.2.7'
  # icon-gen declares sharp ^0.33.4 (0.33.x only).
  'icon-gen>sharp': 0.35.4

patchedDependencies:
  electron-installer-redhat@3.4.0: patches/electron-installer-redhat@3.4.0.patch

minimumReleaseAgeExclude:
  # Temporary until @openrouter/ai-sdk-provider@3.0.0 clears release-age threshold
  - '@openrouter/ai-sdk-provider@3.0.0'
