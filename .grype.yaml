# Grype configuration for toolhive-react.
# - node_modules/:        lock file is the source of truth; scanning installed packages is redundant.
# - dist/, out/:          build artifacts produced by Vite / Electron Forge.
# - bin/:                 downloaded binaries (e.g. thv), scanned by their own pipelines.
# - .webpack/, .vite/, .cache/: build-tool caches, not source packages.
# - coverage/, playwright-report/, test-results/, test-videos/: test output, not source packages.

# Only report vulnerabilities that have a fix available — unfixed ones are noise with no actionable remedy.
only-fixed: true

ignore:
  - vulnerability: GHSA-mh99-v99m-4gvg
    package:
      name: brace-expansion
      version: 1.1.16
      type: npm
    reason: >-
      brace-expansion 1.1.16 is a build-only dependency of Electron Forge,
      @electron/asar, and ESLint through minimatch 3.x. The only patched release
      is 5.0.8, whose changed export shape breaks these consumers. The vulnerable
      expansion input is limited to developer-controlled build and lint globs and
      is not reachable in the packaged application.
  - vulnerability: GHSA-mh99-v99m-4gvg
    package:
      name: brace-expansion
      version: 2.1.2
      type: npm
    reason: >-
      brace-expansion 2.1.2 is a build-only dependency of @electron/universal
      through minimatch 9.x. The only patched release is 5.0.8, whose changed
      export shape is incompatible with this consumer. The vulnerable expansion
      input is limited to developer-controlled packaging globs and is not
      reachable in the packaged application.
  - vulnerability: GHSA-w3rx-r6r6-pgpr
    package:
      name: image-size
      version: 0.7.5
      type: npm
    reason: >-
      image-size 0.7.5 is a build-only dependency of @electron-forge/maker-dmg
      through electron-installer-dmg and appdmg, used solely to measure the DMG
      window artwork during macOS packaging. appdmg is an optional darwin-only
      package that is never installed on Linux/Windows and is never shipped in
      the packaged application. GHSA-w3rx-r6r6-pgpr is an infinite-loop denial
      of service in the ICNS parser, which here only ever parses
      icons/icon.icns and assets/dmg-installer-background.png, two static
      assets committed to this repository. The fix requires image-size 2.0.3,
      whose rewritten API (named export, Buffer-only synchronous entry point)
      is incompatible with appdmg 0.6.6, an unmaintained package with no
      further releases.
  - vulnerability: GHSA-g3hv-75wg-m249
    package:
      name: minimatch
      version: 10.2.5
      type: npm
    reason: >-
      minimatch 10.2.5 is a lint-only dependency of eslint, @eslint/config-array
      and @typescript-eslint/typescript-estree, never shipped in the packaged
      application. GHSA-g3hv-75wg-m249 is a denial of service via globparts
      amplification that requires attacker-controlled glob patterns; here the
      patterns come only from the repository's own ESLint config and CLI
      arguments. The only patched line is minimatch 11, a matcher rewrite that
      drops makeRe/AST; even the latest eslint and typescript-eslint releases
      still declare minimatch ^10.
  - vulnerability: GHSA-g3hv-75wg-m249
    package:
      name: minimatch
      version: 9.0.9
      type: npm
    reason: >-
      minimatch 9.0.9 is a build-only dependency of @electron/universal (via
      @electron/packager / Electron Forge), used to match the asar allow-list
      while packaging macOS universal builds, and is never shipped in the
      packaged application. GHSA-g3hv-75wg-m249 requires attacker-controlled
      glob patterns; here the only pattern is the developer-controlled
      packaging config. The fix requires minimatch 11, a major rewrite that
      @electron/universal 2.x does not support.

exclude:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/bin/**'
  - '**/out/**'
  - '**/.webpack/**'
  - '**/coverage/**'
  - '**/playwright-report/**'
  - '**/test-results/**'
  - '**/test-videos/**'
  - '**/.vite/**'
  - '**/.cache/**'
